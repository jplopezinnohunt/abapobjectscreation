# =====================================================================================
# BRAINTOOLBOX — el modelo canonico de COMO TRABAJAMOS
# =====================================================================================
# Se llamaba "el brain del brain", que dice DONDE vive y no QUE es. Esto es la caja de
# herramientas del cerebro: los roles, los instrumentos, el metodo y como mejora. Es el unico documento que se
# describe a SI MISMO -- todo lo demas del cerebro habla de UNESCO; esto habla de
# nosotros.
#
# NO es prosa: cada afirmacion de aqui se mide en un fichero real, y la columna `se_mide_en`
# dice cual. Si una cifra de aqui no se puede recalcular, esa linea esta muerta.
#
# Fijado: 2026-08-27 (s105) · Autor del modelo: JP · Escrito por el agente.
# =====================================================================================

version: 1.0
fijado: 2026-08-27
sesion: 105
se_regenera_con: python brain_v2/build_toolgraph.py
grafo: brain_v2/toolgraph.json

# -------------------------------------------------------------------------------------
# 1. LOS TRES ROLES, y el criterio que los separa
# -------------------------------------------------------------------------------------
# "Si es para leer es SKILL; si decide, es AGENTE; si descubre, es MINERO."
roles:
  SKILL:
    es: conocimiento curado de un dominio — como es, que trampas tiene
    se_consume: se LEE
    se_especializa_por: DOMINIO
    vive_en: .claude/skills/*/SKILL.md
    se_pierde_cuando: nadie lo lee
    medido_hoy: 63 skills · 36 sin ningun lector
    ojo: >
      son DOS problemas distintos y juntarlos esconde el que importa — esa idea sigue en
      pie y es del claim 618. Sus CIFRAS ya no: se calcularon sobre una senal inflada
      (claim 622). Hoy, de 24 sin lector, CUATRO tienen deuda medida
      (sap_transport_companion 7, sap_company_code_copy 7, fi_domain_agent 2,
      sap_expert_core 1) y VEINTE no los deberia leer nadie tampoco — tema dormido, no
      hueco. fi_domain_agent, que encabezaba la lista vieja con 15, tiene 2.
      ⛔ estas cifras de DENTRO del texto NO las vigila braintoolbox_check, que solo
      compara las 16 de cabecera. Derivaron el mismo dia que se escribieron (6/6/1/1 ->
      7/7/2/1) al reconstruirse el grafo. Al tocar el reparto, recontar a mano:
      python -c "import json,collections; tg=json.load(open('brain_v2/toolgraph.json'))"
      sobre aristas LEE/DEBERIA_LEER por skill.
    ojo_2_la_lista_corta_no_es_un_veredicto: >
      Ni siquiera la senal depurada PRUEBA relevancia: es un ranking de donde MIRAR. En
      s106, sap_transport_companion salia el primero con 6 y al abrirlo NO procedia — no
      es conocimiento de transportes, es el metodo para CONSTRUIR el companion (Template
      Structure, HTML Style Guide), y A40/A50 ya leen sap_transport_intelligence, que es
      el skill de verdad. Comparten E070/E071 porque el companion documenta esas tablas.
      Conectar por la cifra habria metido a dos algoritmos a leer una guia de maquetacion.
      De 6 candidatos revisados a mano, 5 procedian y 1 no. SE ABRE EL SKILL ANTES DE
      CONECTAR.

  AGENTE:
    es: un ROL CON CRITERIO — decide que aplicar y cuando, orquesta, se niega a concluir
        sin evidencia
    se_consume: se INVOCA
    se_especializa_por: DOMINIO
    vive_en: .claude/agents/*.md
    se_pierde_cuando: su metodo vive solo en su prompt y muere con el
    medido_hoy: 14 agentes · 0 sin instrumento declarado (eran 5)

  MINERO:
    es: un instrumento de EXPLORACION — descubre lo que no sabias que existia
    se_consume: se EJECUTA
    se_especializa_por: TIPO DE EXPLORACION      # <-- el otro eje
    vive_en: brain_v2/methods/algorithms.json (bound_in apunta al script)
    se_pierde_cuando: no esta registrado y muere con su caso
    medido_hoy: 74 mineros sobre 12 clases de mineria

  # Dos roles mas, que no son de conocimiento sino de control:
  GATE:
    es: una puerta que VIGILA un store y falla con exit 1
    vive_en: Zagentexecution/quality_checks/*.py con QUALITY_CHECK declarado
    se_pierde_cuando: no declara `tier` — el runner lo descubre y lo marca UNCLASSIFIED,
                      o sea existe sin gatear nada
    medido_hoy: 70 gates
  STORE:
    es: el sitio donde algo ATERRIZA. Cada store es la fuente de su tipo de nodo
    medido_hoy: 58 stores

# -------------------------------------------------------------------------------------
# 1a. LA PROCEDENCIA — el tercer eje, y el que explica por que faltaban agentes (s106)
# -------------------------------------------------------------------------------------
# Peticion del dueno: "registra los agentes del harness". Al ir a hacerlo aparecio que no
# es un hueco de datos sino de EJE: los dos ejes de la seccion 2 (dominio x tipo de
# exploracion) NO clasifican a un agente como `Explore`, que no es de ningun dominio ni de
# ningun tipo de mineria. Lo que lo distingue es DE DONDE VIENE.
procedencia:
  _por_que_es_un_eje: >
    Un instrumento PROPIO vive en el repo, se versiona y viaja con el proyecto. Uno DEL
    HARNESS lo da el runtime a la SESION, no al disco: no se versiona, no viaja, y puede
    cambiar entre sesiones sin que nadie lo note. Uno DE OTRO PROYECTO existe y no es
    invocable desde aqui. Son tres regimenes distintos de durabilidad, y tratarlos igual
    es lo que dejaba a seis agentes fuera del modelo.

  PROPIO:
    vive_en: .claude/agents/*.md — versionado
    medido_hoy: 14
    ojo: >
      ser propio NO garantiza ser invocable. Medido en s106: `log-process-discovery` y
      `process-guardian` estan en disco y NO fueron ofrecidos en esta sesion. El roster
      es POR SESION, en los dos sentidos.

  DEL_HARNESS:
    vive_en: ninguna parte del repo — lo entrega el runtime a la sesion
    medido_hoy: 6
    quienes: [Explore, Plan, general-purpose, claude, claude-code-guide, statusline-setup]
    que_son: >
      Explore = barrido de lectura amplio, sin dominio: se especializa por ALCANCE, no por
      tema. Plan = arquitecto, disena sin escribir. general-purpose y claude = cajon de
      sastre. claude-code-guide = conocimiento sobre la propia herramienta, o sea un SKILL
      servido como agente. statusline-setup = utilidad de configuracion.
    ⛔_no_es_medible_desde_disco: >
      ESTA LISTA NO SE PUEDE RECALCULAR desde ningun fichero, y por eso rompe la regla de
      cabecera de este documento. Es lo unico aqui DECLARADO POR UNA SESION en vez de
      medido. Un minero que enumere `.claude/agents/` encontrara 31 en el ecosistema y
      seguira estructuralmente ciego a estos 6: si reporta "hay 14" comete el defecto de
      H134. Debe emitir UNOBSERVABLE para esta mitad (claim 616).

  DE_OTRO_PROYECTO:
    medido_hoy: 17 en unescrp
    quienes: >
      crp-brain-steward, crp-coordinator, crp-process-guardian, crp-quality-auditor,
      crp-services-expert, crp-test-{automation-expert,case-builder,coordinator,runner},
      crp-ui-expert, crp-wf-expert, fi-posting, sap-asr-expert, sap-backend,
      sap-standard-miner, sap-workflow, session-manager
    ⛔_el_solape_es_por_ROL_no_por_NOMBRE: >
      Comparados por NOMBRE, los 17 dan CERO solape con nuestros 14. Comparados por ROL
      hay al menos dos duplicados: crp-brain-steward === brain-steward y
      crp-process-guardian === process-guardian. Otra vez el alias que da cero: el prefijo
      del proyecto hace que dos instrumentos con la misma funcion parezcan cosas
      distintas. Antes de "adoptar" uno de fuera, comparar por lo que HACE.

  el_defecto_que_esto_destapa_en_el_termometro: >
    DELEGA se deriva de que un agente NOMBRE a otro en su fichero de prompt. Un agente del
    harness NO TIENE fichero de prompt en nuestro repo, asi que no puede aparecer ni como
    origen ni como destino de DELEGA — JAMAS, por construccion. Y no es un detalle: medido
    en s106 por consumo, `Explore` gasto ~301K tokens en dos pasadas, MAS QUE NINGUN OTRO
    agente (banca 222K, miner-onboarding 197K, brain-steward 200K), y produjo la fractura
    en 4 piezas del circuito P2P, el punto ciego del grafo de companions y una correccion
    a un skill escrito ese mismo dia. El instrumento que mide nuestra colaboracion es
    ciego al agente que mas colaboro. Cualquier cifra de colaboracion se lee sabiendo esto.
  se_trata_en: PMO H140 — minero para enumerar + agente para adoptar, con la frontera declarada

# -------------------------------------------------------------------------------------
# 1b. EL CONOCIMIENTO DRIVER — la teoria que MANDA sobre como clasificamos (s106)
# -------------------------------------------------------------------------------------
# Decision del dueno: esto no es una investigacion archivada, es un DRIVER. Se lee ANTES
# de decidir una clasificacion, igual que los modos de fallo se leen antes de publicar
# una cifra. Hasta s106 la caja no citaba el store de research ni una sola vez: teniamos
# 8 investigaciones cerradas y ninguna gobernaba una decision.
conocimiento_driver:
  process_mining_object_centric:
    fuente: brain_v2/research/w3t7ufrbg_process_mining_objectcentric.json
    estado: CLOSED_VERIFIED
    de_donde: van der Aalst / RWTH PADS — OCEL 2.0 (ocel-standard.org, arXiv 2403.01975)
    cuanto_sobrevivio: >
      4 claims de 102 extraidos. 21 REFUTADOS. Verificacion adversarial 3-0. Los 4 que
      quedan son la fundacion GENERICA; todo lo especifico de SAP murio.

    lo_que_manda: >
      OCEL 2.0 elimina la restriccion de UN SOLO CONCEPTO DE CASO: un evento puede
      referenciar varios objetos de tipos distintos, con relaciones objeto-a-objeto (O2O)
      ademas de evento-a-objeto (E2O), y cualificadores en ambas. De ahi salen dos
      distorsiones que el modelo de caso unico produce SIEMPRE y que nombrarlas es media
      solucion:
        CONVERGENCIA — el mismo evento duplicado en cada caso al que pertenece
        DIVERGENCIA  — no poder separar eventos causalmente no relacionados
      La consecuencia practica: el PROCESO no es un contenedor al que se asignan cosas,
      es una PERSPECTIVA calculada bajo demanda sobre una unica fuente que no cambia.

    como_nos_aplica: >
      Nuestro `process_map` en domains.json pregunta "que dominios PERTENECEN a P2P" como
      si la pertenencia fuera plana y exclusiva. Eso ES la restriccion de caso unico, y
      por eso el modelo no puede expresar ni el ORDEN ni que BCM este EN MEDIO. El dueno
      lo dijo con un ejemplo antes de leer nada de esto: "no hay problema en que un
      subproceso se identifique en varios procesos — en payroll, si hay que pagar,
      tendras Payment BCM". Eso es convergencia/divergencia con otras palabras, y el
      campo le da la razon. `process_axis` YA es una lista: la forma es correcta y lo que
      falta es completarla, derivarla en vez de mantenerla a mano, y ponerle puerta.

    ⛔_lo_que_NO_se_puede_citar: >
      Los 21 refutados NO se reasertan nunca, por mucho que suenen utiles: las recetas de
      extraccion por CDHDR/CDPOS, el Graph of Relations, la metodologia OCPM2 y su
      Extraction Matrix, HOEG/GNN, el techo de escalabilidad de ocpa, y los modelos de
      referencia + libreria de 1.000 incidencias de SAP Signavio. Son PISTAS, no hechos.
      El propio aviso de alcance de la investigacion lo dice: el conjunto verificado es
      MUCHO mas estrecho que la pregunta.

    hueco_declarado_que_nos_toca: >
      Como aflorar BDC/APQ*, exits/BAdI/ENHO y la capa RFC/.NET como fuentes de eventos
      object-centric NO TIENE METODO VERIFICADO (openQuestion 4 de la investigacion).
      Traduccion: para CLASIFICAR no hace falta mas research; para CONSTRUIR el minero
      end-to-end, si hay hueco real.

    defecto_del_propio_store: >
      El campo `caveats` de esa investigacion esta CORROMPIDO: es un string explotado en
      2.050 entradas de un caracter. El texto se recupera juntandolas, pero cualquier
      consumidor que itere `caveats` recibe letras sueltas. Anotado, no arreglado aun.

# -------------------------------------------------------------------------------------
# 2. LOS DOS EJES — por que un minero sirve a cualquier dominio
# -------------------------------------------------------------------------------------
ejes:
  _idea: >
    Agentes y skills se especializan por DOMINIO; los mineros, por TIPO DE EXPLORACION.
    Son ORTOGONALES. Por eso un minero sirve a cualquier dominio: no es que sea general,
    es que esta especializado en otro eje. Esto es lo que hace extraible un metodo que
    vive dentro de un agente.
  dominio: [Payment_BCM, Closing_Activities, Master_Data_Governance, Treasury, PSM_FM, ...]
  tipo_de_exploracion:
    - REALIDAD             # que ES cada nombre antes de contarlo
    - CANAL_Y_ACTOR        # por donde entra el trabajo y quien lo mueve
    - CASO                 # que documento es el caso
    - FLUJO_DE_CONTROL     # que sigue a que
    - CONFORMIDAD          # lo real contra lo que deberia ser
    - OBJETO_CENTRICO      # varios objetos a la vez
    - DERIVA               # como cambia en el tiempo
    - RESTO_SIN_EXPLICAR   # lo que no sabemos nombrar todavia — el sensor
    - TECNICA_DE_LECTURA   # no mina: hace posible minar
    - CODIGO_COMO_FUENTE   # QUE HACE el sistema, leido de su propio fuente. Anadida s105:
                           # trece algoritmos leian objetos ABAP repartidos en seis cajones y
                           # cinco sin clase — el hueco era de la taxonomia, no de ellos. Las
                           # reglas que DECIDEN viven muchas veces en el codigo y no en la
                           # config, y ningun analisis de customizing las ve.
    - COLABORACION
    - ORQUESTACION

  criterio_de_corte: >
    Cuando un metodo vive dentro del prompt de un agente: LO QUE NECESITA CRITERIO se
    queda en el agente; LO QUE ES DETERMINISTA sale como minero. Ejemplo medido: leer un
    PDF de autoridad necesita criterio (se queda en authority-doc-reader); comparar lo
    autorizado contra lo pedido es determinista (salio como A64, y ahora lo ejecuta
    cualquiera).

# -------------------------------------------------------------------------------------
# 3. LA TRIADA — de cada trabajo quedan TRES cosas
# -------------------------------------------------------------------------------------
triada:
  _idea: >
    Todo trabajo que descubre algo deja tres piezas, y SE PIERDEN POR SEPARADO. Solo se
    echa de menos el proceso, porque es el entregable. Lo que se nota se guarda; lo que
    no se nota, no.
  piezas:
    # escalar de bloque a proposito: el texto lleva un ':' y en plano rompia el parseo
    - objeto: >
        lo que descubriste — ¿esta clasificado donde PERTENECE, y en TODOS los
        sitios a los que pertenece? Un objeto puede ser varias cosas a la vez:
        Solution Manager es INTERFAZ y SISTEMA, y registrarlo como lo primero no
        lo registra como lo segundo.
    - proceso: como funciona eso    — ¿doc de proceso y companion en su dominio?
    - metodo:  como lo descubriste  — ¿registrado como minero o algoritmo?
  se_mide_en: Zagentexecution/quality_checks/work_triad_check.py
  medido_hoy: 15 trabajos · 6 con las tres piezas · 9 incompletos
  regla_derivada: feedback_every_work_leaves_three_things

# -------------------------------------------------------------------------------------
# 4. EL BUCLE — ejecutar, aprender, mejorar
# -------------------------------------------------------------------------------------
bucle:
  _idea_de_JP: >
    "Un nuevo conocimiento o descubrimiento agrega ARISTAS, que pueden llevar a nuevas
    preguntas de todos. Basicamente es la naturaleza de la evolucion del conocimiento
    humano."
  _consecuencia: >
    Un descubrimiento NO es un dato que se archiva: es un EVENTO QUE INTERROGA AL RESTO.
    No crece el grafo por el nodo, crece por las aristas — y cada arista nueva puede
    invalidar lo que otro instrumento daba por sabido. Ese segundo efecto se perdia entero.
  aristas:
    LEE:          quien lee de verdad un skill
    DEBERIA_LEER: quien opera sobre sus mismas tablas y no lo nombra   # LA DEUDA
    INVOCA:       agente -> algoritmo/minero
    DELEGA:       agente -> AGENTE que nombra en su prompt              # LA COLABORACION
    DESCUBRE:     minero -> clase de exploracion que cubre
    ATERRIZA_EN:  algoritmo -> store
    VIGILA:       gate -> store
    RECUERDA:     instrumento -> memoria de metodo                      # LA MEJORA
  propagacion:
    instrumento: process_mining/knowledge_propagation.py  (A63)
    formas: [EXISTE_ALGO_QUE_NO_ESTABA, EL_INSTRUMENTO_ES_CIEGO, UN_MODO_SE_DEGRADA]
    aterriza_en: process_mining/mining_findings.json  (via mining_bus.preguntar)
    medido_hoy: 22 preguntas dirigidas

# -------------------------------------------------------------------------------------
# 5. EL TERMOMETRO — la unica cifra que dice si el bucle cierra
# -------------------------------------------------------------------------------------
termometro:
  conectividad_pct: 44.2
  formula: LEE / (LEE + DEBERIA_LEER)
  hoy: LEE 84 · DEBERIA_LEER 106
  salto_s106: >
    Era 19,7% con LEE 72 · DEBERIA_LEER 293, y NO subio porque se conectara nada: subio
    porque el DENOMINADOR estaba inflado. `cubre_tablas` no contenia tablas — contenia
    cualquier nombre SAP en mayusculas, asi que RFC_READ_TABLE (en 109 de 302 solapes) y
    las sociedades (UBO 62, IIEP 31, UIS 27...) fabricaban aristas entre artefactos que
    no comparten tema. Depurado contra TADIR, que es quien sabe QUE ES cada nombre,
    quedan 83 de 302. Claim 622. El ranking se invirtio: fi_domain_agent, que era la
    prioridad numero uno con 15, tiene 1.
  que_significa: >
    De todo el conocimiento que un instrumento DEBERIA leer, que porcentaje lee de verdad.
    SI UNA SESION NO SUBE ESA CIFRA, CONECTO MENOS DE LO QUE SOLTE.
  ⛔_no_usar_sola_como_objetivo: >
    LEE es que el NOMBRE del skill aparezca como substring en el texto del consumidor. Es
    una CITA, no una lectura. Se puede llevar al 100% pegando 83 nombres en unos ficheros
    sin que nadie lea nada. Sirve para RANKEAR donde mirar; no vale como meta.
  se_mide_en: brain_v2/toolgraph.json -> salud.aristas_que_faltan_frente_a_las_que_hay
  otras_senales:
    skills_sin_ningun_lector: 36
    agentes_sin_instrumento_declarado: 0
    agentes_que_no_delegan_en_nadie: 0
    instrumentos_rotos_o_con_defecto_vivo: 0
  ⛔_los_13_skills_nuevos_nacen_SIN_LECTOR_y_eso_es_correcto: >
    s107: skills_sin_ningun_lector paso de 24 a 36 al crear los 12 de mineria y braintoolbox.
    NO es un empeoramiento: un skill nace sin lector por construccion, y la cifra mide
    conocimiento que existe y no se aplica. Lo que habria que vigilar es que siga igual dentro
    de tres sesiones -- entonces si seria abandono. Leer esta cifra sin la fecha de creacion
    de cada skill invita a la conclusion contraria a la verdadera.
  ⛔_lo_que_esta_cifra_NO_distingue_y_costo_H141: >
    'no delegar en nadie' y 'estar aislado' NO son lo mismo, y el agregado los juntaba. De los
    cinco que contaba, CUATRO recibian delegacion de otros -- estaban integrados, solo que en
    una direccion. El unico AISLADO de verdad, con cero aristas en los dos sentidos, era
    document-output-discovery: el agente que nace de un canal que estuvo caido tres dias
    porque nadie era su dueno, convertido el mismo en nodo huerfano del grafo que mide
    colaboracion. Un agregado sin nombres no se puede accionar. s107 anade a `salud`
    agentes_AISLADOS_en_los_dos_sentidos, que es la cifra que duele.
  ⛔_y_NOMBRAR_no_es_ENTREGAR: >
    DELEGA se derivaba de que un agente NOMBRE a otro en su prompt, y eso da por hecho que
    nombrarlo es pasarle trabajo. Medido s107 sobre las 26 aristas: 22 SI eran entregas --
    casi todos usan la misma convencion, una tabla `| agente | cuando |` -- y CUATRO eran
    menciones de estilo ("no anades ceremonia, como el process-guardian"). Es el mismo techo
    que el LEE, que cuenta una CITA como una lectura. `salud` publica ahora las dos cifras y
    la que vale es delega_ENTREGA_declarada.
    ⚠ Y sigue siendo colaboracion DECLARADA, no OBSERVADA: que la entrega este escrita no
    prueba que ocurra en ejecucion (known_unknown de abajo, sin cerrar).

# -------------------------------------------------------------------------------------
# 6. LOS MODOS DE FALLO DE LA PROPIA CAJA — medidos, no temidos
# -------------------------------------------------------------------------------------
# Todos son la MISMA falta con caras distintas: afirmar sobre una poblacion sin comprobar
# que el metodo de medida se le aplica. Se repitio ~10 veces el 26-27 de agosto.
modos_de_fallo:
  - nombre: DENOMINADOR INCOMPLETO
    pasa_cuando: se mide una poblacion contra un patron sin demostrar que se le aplica
    ejemplos_medidos:
      - barrer cuentas de UNES contra FS11, que es la version de IIEP/ICTP -> 144 M EUR inventados
      - exigir registro a un PERNR como si fuera estructura -> 33 huecos falsos
      - lista de "casas" incompleta -> arboles DMEE marcados perdidos llevando meses anotados
    defensa: el instrumento DERIVA su denominador; nunca lo supone

  - nombre: EL ALIAS QUE DA CERO
    pasa_cuando: una clave canonica no es la clave del registro
    ejemplo_medido: Treasury -> Treasury_EBS, que no existe en domains.json -> el dominio
                    entero parecia vacio
    defensa: >
      fallback al crudo. Un alias mal resuelto NO DA ERROR: da un cero, que es peor

  - nombre: CREERSE EL PROPIO PRINT
    pasa_cuando: se reporta exito por lo que se imprime en vez de por lo que queda escrito
    ejemplo_medido: >
      "publicada a 15 instrumentos" cuando en el bus habia 3
    defensa: verificar LEYENDO EL DESTINO. Correr sin error no es validacion

  - nombre: EL HUERFANO PROPIO
    pasa_cuando: se crea un instrumento y no se declara
    ejemplos_medidos: 6 checks sin tier · 5 agentes sin instrumento · un minero sin algoritmo
    defensa: >
      es el mismo defecto que le achacamos a UNES_DEPOSIT — lo que se mantiene a mano se
      degrada — aplicado a nuestro propio trabajo. Cada vez lo cazo un gate, no yo

  - nombre: REINVENTAR LO QUE EXISTE
    pasa_cuando: se propone un instrumento sin mirar el toolgraph
    ejemplo_medido: iba a escribir un capability_wiring_check que ES este grafo
    defensa: consultar toolgraph.json y su seccion `salud` ANTES de proponer nada
    ⛔_la_defensa_NO_cubre_los_HELPERS_y_ahi_esta_el_agujero: >
      El toolgraph mide si se leen los SKILLS. No mide si se USAN los HELPERS, y por eso
      su defensa no me salvo. Medido s106: `brain_v2/canonical.py` existe, su docstring
      dice literalmente "ONE place that resolves a domain name to its canonical key",
      expone `canonical()`, `aliases_of()` y `same(a, b)`, y lo IMPORTAN CINCO modulos.
      Yo resolvi alias A MANO TRES VECES el mismo dia y me equivoque en DOS: publique
      "5 referencias rotas en process_map" que eran alias declarados, y estuve a punto de
      "arreglar" `parent: Treasury_EBS`, que es la clave canonica correcta. `same(a,b)`
      era exactamente la funcion que lo impedia. No fue falta de conocimiento: fue no
      alargar la mano.
      LA DIFERENCIA QUE IMPORTA: un skill no leido es conocimiento que no se aplica; un
      helper no usado es una FUNCION QUE YA RESUELVE EL PROBLEMA y que se reescribe peor.
      El segundo produce hallazgos FALSOS, no solo pobres.
      ✅ RESUELTO s107 (H142): el HELPER es ahora un tipo de NODO del toolgraph. Se DERIVA lo
      derivable -- el nodo y la arista USA salen de los imports reales, y 2+ importadores es
      lo que separa un helper compartido de un script suelto: son DIEZ, no uno.
      `metodo.py` lo importan 35 modulos, `gold_ref.py` 14, `canonical.py` 11. Y se DECLARA
      solo lo que no se puede derivar: que PROBLEMA resuelve, en un dict `HELPER` con sus
      `senales`, misma convencion que `QUALITY_CHECK`. De ahi sale DEBERIA_USAR, que es a los
      helpers lo que DEBERIA_LEER es a los skills.
      Lo que queda medido y abierto: 1 de 10 tiene ficha, asi que el abandono de los otros
      NUEVE sigue sin medirse -- estan nombrados en `salud.helpers`, no escondidos. Y USA
      cuenta un IMPORT, no una llamada: mismo techo que el LEE.

  - nombre: EL SUBAGENTE NO DISTINGUE A SU PADRE DE UN EXTRANO
    pasa_cuando: >
      un agente largo mira el repo mientras trabaja y ve commits que el no hizo. Desde
      DENTRO de un subagente, el trabajo de la sesion que lo lanzo y el de un escritor
      ajeno se ven EXACTAMENTE IGUAL: no tiene ninguna vista de lo que hace su padre.
    ejemplo_medido: >
      s106. brain-steward corrio un rebuild de 56 minutos y al terminar levanto una
      bandera de gobernanza: "7 commits de otro hilo activo aterrizaron durante mi
      ventana; confirmad si era una sesion paralela autorizada". NO LO ERA. Los ocho
      commits entre 16:13 y 16:57 eran del AGENTE PRINCIPAL de su propia sesion,
      verificados uno a uno por hora y autor. Y el dueno lo confirmo por el otro lado: el
      unico proyecto en paralelo es unescrp, que tiene otro arbol y otro .git, asi que no
      puede commitear aqui.
    por_que_importa: >
      NO es un error de juicio del agente: es una CEGUERA ESTRUCTURAL, y va a repetirse
      cada vez que un agente largo se solape con el trabajo del padre. Callarla seria
      peor -- desde donde el miraba era indistinguible de un doble escritor real. Lo que
      hay que arreglar no es al agente, es la LECTURA de su bandera.
    defensa: >
      ante una bandera de "escritor paralelo" levantada por un subagente, VERIFICAR ANTES
      DE CREER: `git log --since=<inicio> --pretty="%h %ad %an %s"` y cruzar con lo que la
      sesion hizo en esa ventana. Observar que el repo cambio es un HECHO; atribuirlo a un
      actor es una HIPOTESIS (regla feedback_do_not_invent_who_changed_the_repo).
    lo_que_si_fue_real_ese_dia: >
      una violacion de un-solo-escritor, pero del PRINCIPAL: escribi claims.json con el
      rebuild_all en curso. Admitido en su commit (b8f9c40). El defecto era mio, no del
      steward, y su verificacion de que no hubo corrupcion era correcta.

  - nombre: EL BUCLE QUE PARECE TRAVESIA
    pasa_cuando: una arista va de un nodo a si mismo y se cuenta como relacion
    ejemplo_medido: >
      94 aristas RECUERDA eran bucles; las 10 "AGENTE->AGENTE" eran diez
      agentes recordando su propia leccion. La colaboracion no era escasa: era CERO
    defensa: >
      contar bucles aparte. Un grafo que cuenta bucles como travesia miente en la
      direccion que mas duele: hace parecer conectado lo que esta solo

# -------------------------------------------------------------------------------------
# 7. LAS PUERTAS QUE LO SOSTIENEN
# -------------------------------------------------------------------------------------
gates_de_la_caja:
  - work_triad_check.py:              las tres piezas de cada trabajo
  - incident_domain_knowledge_check.py: todo incidente deja proceso, no solo caso
  - validate_ontology.py:             bidireccional — declarado <-> registro
  - validate_algorithms.py:           79 casos golden sobre los algoritmos
  - rebuild_lock.py:                  un solo escritor, con PID y heartbeat
  - stop_integrity_hook.py:           durabilidad y arsenal al cerrar

# -------------------------------------------------------------------------------------
# 1c. CADA ROL, SU PRIMITIVA REAL DE CLAUDE (s107) — y el dia que descubrimos que no lo eran
# -------------------------------------------------------------------------------------
# Lo destapo el dueno con una pregunta: «¿esto era prosa solo para vos? No skills reales en
# terminos de Anthropic». Tenia razon, y era el agujero de fondo de toda la sesion.
primitivas:
  _el_hallazgo: >
    MEDIDO 2026-08-27. `~/.claude/skills/` tiene 11 skills y el harness LAS OFRECE. Nuestras
    50 vivian en `.claude/skills/`, un directorio que el harness NO ESCANEA: NINGUNA era
    invocable. Estaban bien escritas -- front-matter con name y description, mejor formadas
    que varias de las 11 reales -- pero en el sitio equivocado. 106 KB de metodo de banca que
    el modelo no podia cargar salvo que alguien abriera la ruta a mano.
    Y explica el sintoma que llevabamos midiendo mal: «24 skills sin ningun lector» NO era
    desidia de los consumidores. Era ESTRUCTURAL: no podian tener lector.
    Movidas en s107 con `git mv` a `.claude/skills/`, 50 de 50 verificadas.
    ⛔ NO VERIFICADO EN VIVO: la documentacion dice que un directorio de skills que no existia
    al arrancar la sesion exige REINICIAR. Se comprueba en la proxima sesion, no antes.

  mapa:
    SKILL:
      primitiva: Claude Skill en .claude/skills/<nombre>/SKILL.md
      estado: MIGRADO s107 (50) — pendiente de verificar en sesion nueva
      lo_que_gana: >
        descubrimiento automatico (cada sesion carga name+description; el CUERPO solo al
        invocar), invocable por el tool Skill y por /nombre, precargable en un subagente con
        el campo `skills:`, y ELEGIBLE POR EL MODELO cuando la descripcion encaja -- que es
        el problema de «saber cuando usar cada cosa» resuelto por la herramienta en vez de
        por disciplina.
      coste_medido: 24.612 caracteres de front-matter en 49 skills ~= 6.150 tokens por sesion
      deuda_que_abre: >
        la doctrina oficial dice «manten SKILL.md bajo 500 lineas» porque UNA VEZ CARGADA LA
        SKILL SE QUEDA EN CONTEXTO todo el turno. sap_payment_bcm_agent son 106 KB. Hay que
        partir las grandes en SKILL.md (navegacion) + ficheros de referencia que se cargan
        solo si hacen falta. NO HECHO.
      campo_a_usar: >
        `user-invocable: false` en las de CONOCIMIENTO DE DOMINIO -- la doc lo describe
        exactamente asi: «background knowledge that isn't actionable as a command». Nadie
        teclea /sap_payment_bcm_agent; Claude si debe cargarlo cuando toca.

    AGENTE:
      primitiva: subagente en .claude/agents/<nombre>.md
      estado: YA ERAN REALES — 14 en disco, ofrecidos por el harness
      matiz_medido: >
        ser propio NO es ser invocable: log-process-discovery y process-guardian estan en
        disco y no fueron ofrecidos ni en s106 ni en s107.
      lo_que_se_anadio_en_s107: >
        el campo `skills:` del front-matter, que PRECARGA el contenido completo del skill en
        el contexto del subagente. Convierte «lee esto primero» de consejo en mecanismo. 11
        agentes lo declaran. ⛔ Estaba INERTE mientras las skills vivieran en .claude/skills:
        el campo resuelve contra el registro de skills. Tras la migracion deberia resolver --
        sin verificar.

    MINERO:
      primitiva: >
        NINGUNA PROPIA, y por eso se pierden. Un minero es un SCRIPT. La primitiva de
        Anthropic que envuelve «un script + cuando correrlo + sus trampas» es una SKILL CON
        EL SCRIPT EMPAQUETADO: la doc lo dice literal en su arbol de ejemplo --
        `scripts/helper.py (utility script - EXECUTED, not loaded)`. El script se EJECUTA, no
        se carga: 72 scripts cuestan CERO contexto.
      donde_se_pierden_MEDIDO: >
        72 mineros registrados, los 72 con script que EXISTE (0 rutas rotas). El agujero no
        es el codigo: son 49 de 72 (68%) que NO LOS INVOCA NADIE. Por clase, la peor es
        CODIGO_COMO_FUENTE (13 mineros, 10 huerfanos); las sanas son REALIDAD, CONFORMIDAD,
        OBJETO_CENTRICO y DERIVA, con 0.
      decision: >
        UNA SKILL POR CLASE DE EXPLORACION, no una por minero. La unidad ya existe en la
        seccion 2 de este documento: 12 clases. Cada skill lleva que contesta esa clase, que
        mineros la implementan, el comando exacto y el `failure_mode` de cada uno; los
        scripts van en su `scripts/` y se ejecutan sin entrar en contexto.
      por_que_no_una_por_minero: >
        MEDIDO: 12 descripciones ~= 1.200 tokens por sesion; 72 descripciones ~= 7.200. Y la
        mayoria de los mineros no son pertinentes a una sesion dada, asi que 72 entradas son
        ruido permanente para que una sea util.
      por_que_esto_arregla_el_68_por_ciento: >
        hoy un minero solo corre si alguien recuerda que existe y abre algorithms.json, que
        es un JSON de 96 fichas que nadie carga. Como skill por clase, el MODELO la elige
        cuando la descripcion encaja con la tarea. Deja de depender de acordarse, que es la
        misma cura que las skills de dominio.
      estado: >
        CONSTRUIDO despues de escribirse este parrafo (s107, commit 0fb64a6): las 12 skills
        existen en `.claude/skills/mining-*`, generadas (no a mano) por
        `scripts/build_mining_skills.py` desde la ficha de cada minero en `algorithms.json` --
        que contesta, comando exacto, `failure_mode`, `lo_que_NO_puede`, `lands_in`. 72/72
        mineros alcanzables por las 12 clases. Editar un SKILL.md a mano se pierde en la
        proxima corrida del generador.
      ⛔_la_metrica_49_de_72_queda_vieja_dila_asi: >
        el "68% sin invocador" de arriba SIGUE PUBLICADO en este mismo parrafo y en claim/PMO
        de sesiones previas, y NO SE RECALCULO tras la migracion porque `INVOCA` en el
        toolgraph mide una arista DISTINTA (agente/script que llama al script del minero por
        NOMBRE, `bound_in`), no si el modelo puede ELEGIR la skill de su clase por descripcion.
        Son dos vias de alcanzabilidad diferentes: la nueva no sustituye a la vieja, la
        complementa. Publicar "49/72" sin esta nota, ahora que las 12 skills existen, se lee
        como que el arreglo no funciono -- y no es eso lo que paso. Recontar `INVOCA` post-
        migracion es trabajo pendiente, no hecho en s107.

    GATE:
      primitiva: script + hook Stop (run_all.py los descubre por QUALITY_CHECK)
      estado: CORRECTO, no toca
      ojo: >
        un gate que ESCRIBE debe llevar `disable-model-invocation: true` si algun dia se
        empaqueta como skill: la doc reserva ese campo para lo que tiene efectos y cuyo
        momento decide la persona.

    STORE:
      primitiva: ficheros. No hay primitiva de Claude para esto y no hace falta.
      estado: CORRECTO

    HELPER:
      primitiva: modulo python importable
      estado: CORRECTO — nodo del toolgraph desde s107 (18 helpers, USA 114)

  lo_que_NO_estabamos_usando_y_ahora_se_sabe_que_existe:
    - "`user-invocable: false` — conocimiento de fondo que el usuario no teclea"
    - "`disable-model-invocation: true` — lo que tiene efectos y decide la persona"
    - "`allowed-tools` / `disallowed-tools` — permisos por skill, sin preguntar"
    - "`context: fork` — correr una skill en su propio subagente"
    - "`model` — modelo por skill"
    - "`when_to_use` — frases disparadoras; suma al tope de 1.536 caracteres del listado"
    - "ficheros de apoyo: reference.md se carga si hace falta; scripts/ se EJECUTA sin cargarse"
    - "roster de hermanos en el contexto del subagente (v2.1.206+): es el fallo de coordinacion que Anthropic documenta, ya resuelto por el harness"

# -------------------------------------------------------------------------------------
# 1d. LO QUE LA HERRAMIENTA NOS DA Y NO USAMOS (s107) — leido en la fuente, no recordado
# -------------------------------------------------------------------------------------
# Peticion del dueno: «que mas de las herramientas de Anthropic no estamos usando y
# deberiamos». Leido en code.claude.com/docs/en/best-practices. Ordenado por el DOLOR MEDIDO
# que explica, no por lo llamativo que suene.
no_usamos:
  STOP_HOOK_QUE_BLOQUEA:
    que_es: >
      la doc: «a Stop hook runs your check as a script and BLOCKS the turn from ending until
      it passes» (Claude Code corta a los 8 bloqueos seguidos). Es un gate DETERMINISTA, no
      un aviso.
    que_tenemos: >
      NUEVE hooks Stop y NINGUNO bloquea: todos imprimen y el turno termina igual. El de
      durabilidad lleva toda la sesion avisando de ficheros sin commitear; el del steward
      pide una pasada que no se ejecuta sola.
    el_dolor_que_explica: >
      ES EL PROBLEMA CENTRAL DE ESTE PROYECTO, escrito una docena de veces con otras
      palabras: «lo que depende de acordarse no pasa». Teniamos el mecanismo determinista
      disponible y usabamos la version advisory.
    ojo: >
      no todo debe bloquear. Un gate en rojo permanente por deuda historica se ignora
      (leccion H131). Bloquear lo que es CIERRE DE ESTA SESION (commit, backup declarado);
      avisar lo que es deuda vieja.
    prioridad: 1
    estado: >
      APLICADO despues de escribirse este parrafo (s107, commit 27645ba): el hook de
      durabilidad (`brain_v2/stop_durability_hook.py`) paso de avisar a bloquear con exit 2
      sobre ficheros FUENTE sin commitear al cierre. Sigue avisando, no bloqueando, sobre
      deuda vieja (regla H131 de arriba respetada).

  CLAUDE_MD_QUE_SE_MUEVE_A_SKILLS:
    que_dice_la_doc: >
      «Bloated CLAUDE.md files cause Claude to ignore your actual instructions!» y «For
      domain knowledge or workflows that are only relevant sometimes, use skills instead.
      Claude loads them on demand without bloating every conversation.» Y el criterio por
      linea: «Would removing this cause Claude to make mistakes?».
    medido_hoy: >
      CLAUDE.md del proyecto 28.625 caracteres + el global 3.342 = ~8.000 TOKENS EN CADA
      SESION, siempre, se usen o no. Frente a eso, las 74 skills cuestan 13,7K en el listado
      y su CUERPO solo se carga al invocarse.
    el_dolor_que_explica: >
      por que se ignoran reglas que SI estan escritas. No es desobediencia: es que compiten
      con 8.000 tokens de instrucciones permanentes. Y buena parte de ese fichero es
      conocimiento de dominio -- exactamente lo que la doc dice que debe ser skill.
    prioridad: 2
    estado: >
      APLICADO despues de escribirse este parrafo (s107, commit d7ce6ed): el metodo WebGUI de
      `CLAUDE.md` se movio al skill que ya existia, -15% medido sobre el fichero. No es el
      adelgazamiento completo (28.625 caracteres siguen siendo mucho conocimiento de dominio
      inline) -- es la primera pasada, no la ultima.

  GOAL:
    que_es: >
      «set the check as a /goal condition. A separate evaluator re-checks it after every turn
      and Claude keeps working until the goal resolves.»
    donde_pega_aqui: >
      cierre de sesion, rebuild, alineacion de master data: todo lo que hoy se comprueba una
      vez y se da por bueno. Es el bucle de verificacion que no tenemos.
    prioridad: 3

  BATCH_Y_HEADLESS:
    que_es: >
      `/batch <instruccion>` parte un cambio entre 5 y 30 subagentes, cada uno en su worktree
      y con su PR. Y `claude -p` corre sin sesion interactiva, apto para bucle sobre una
      lista con `--allowedTools` acotando permisos.
    donde_pega_aqui: >
      (a) la migracion de HOY: 542 referencias reencaminadas a mano en 61 ficheros;
      (b) «un minero registrado que no se ejecuta es documentacion» -- 72 mineros que nadie
      corre son un bucle `claude -p` sobre la lista, no un problema de voluntad.
    prioridad: 4

  LO_DEMAS_QUE_NO_USAMOS:
    - "plan mode (Shift+Tab) — explorar y planear ANTES de tocar; no lo usamos nunca"
    - "/rewind y checkpoints — deshacer conversacion y codigo a un punto; util al probar algo arriesgado"
    - "/context y /doctor — MEDIR que se carga al arrancar en vez de estimarlo"
    - "/btw — preguntas laterales que NO entran en el historial"
    - "/clear entre tareas no relacionadas — la doc lo pone como el fallo #1 (la sesion cajon de sastre)"
    - "@ruta en el prompt e imports @path en CLAUDE.md"
    - "subagente REVISOR adversarial sobre el diff, en contexto fresco, antes de dar por hecho"
    - "agent teams / agent view (experimental) para coordinar sesiones en paralelo"

  ⛔_el_patron_de_los_dos_primeros: >
    Los dos que mas duelen no son funciones exoticas: son la version DETERMINISTA de cosas
    que ya haciamos en version ADVISORY. Teniamos el hook y lo usabamos para imprimir;
    teniamos las skills y el conocimiento estaba en CLAUDE.md. El defecto no fue no conocer
    la herramienta: fue usar la mitad blanda de una herramienta que tiene mitad dura.

# -------------------------------------------------------------------------------------
# 7b. EL BUCLE, EVALUADO CONTRA UNA SESION REAL (s107, 2026-08-27)
# -------------------------------------------------------------------------------------
# Peticion del dueno: "evaluame el valor de lo que estamos haciendo, y si la colaboracion de
# agentes y la clasificacion de la caja estan ayudando". Contestado con lo medido de UNA
# sesion entera, no con impresiones. Se conserva aunque envejezca: es la primera vez que la
# caja se mide contra su propio uso.
evaluacion_s107:
  que_produjo_la_sesion: >
    7 items del PMO cerrados (H137 tramo principal + barrido, H138, H139, H135, H136, H140,
    H141, H142), 4 claims (627/628/629 + 2 reglas), 5 instrumentos nuevos o mejorados,
    27 ficheros, 8 commits. Pero el VALOR no fueron los H: fueron los SEIS defectos vivos
    encontrados en nuestros propios instrumentos, todos por el mismo metodo.

  la_clasificacion_de_la_caja_AYUDO_A_MEDIAS_y_se_puede_decir_cual_mitad: >
    El coordinador (`graph_queries.py tool para "<tarea>"`) se consulto UNA vez, al empezar
    H137, y su respuesta tiene dos mitades. La de CONOCIMIENTO -- bloque
    `6_LO_QUE_YA_SABEMOS`, claims 623/624/626 -- se uso y ahorro re-derivar el tramo entero
    pago->BCM, que otra sesion ya habia medido. La de HERRAMIENTAS falló en el consumidor:
    su primera linea decia `1_LEE_ESTO_PRIMERO: sap_payment_bcm_agent` (106 KB de metodo de
    banca) y NO SE LEYO. Medido: 0 aperturas en toda la sesion.
    ⛔ Esto es H125 con una vuelta mas. H125 dice "el coordinador existe y nadie lo llama
    solo". El hallazgo de s107 es peor: LLAMANDOLO, su recomendacion numero uno se ignora.
    El orden de su salida esta pensado para eso -- los SKILL van primero -- y aun asi.
    La leccion no es "hay que acordarse": es que un consejo que no cambia nada del flujo se
    lee como decoracion. Palanca abierta.

  la_colaboracion_de_agentes_NO_SE_PUEDE_EVALUAR_HOY_y_esa_es_la_respuesta: >
    Esta sesion corrio con CERO agentes (el harness lo pidio asi), asi que no aporta caso.
    Lo que si aporta es el estado del INSTRUMENTO que deberia contestarlo, y esta roto:
    `brain_v2/agent_invocations.jsonl` tiene 568 eventos y 547 SIN AGENTE. El diagnostico
    que llevaba escrito -- "el payload no lo lleva" -- es FALSO: `payload_keys` ya listaba
    `agent_type`, o sea la clave EXISTE y llega VACIA. Y hay una hipotesis con evidencia:
    esta sesion registro CUATRO `SubagentStop` habiendo lanzado CERO agentes, mientras
    corrian varias tareas de fondo. Si `SubagentStop` tambien dispara por una tarea de fondo,
    el 96% de filas anonimas no es un fallo de atribucion: es que la mayoria NO SON AGENTES,
    y cualquier metrica de colaboracion construida encima mide otra cosa. Anotado en el
    propio registro como NO VERIFICADO (s107) para que lo cierre quien pueda correr las dos
    corridas.
    LO QUE SI ESTA MEDIDO, de s106: `Explore` produjo el hallazgo que ORIGINO H137 -- la
    fractura del circuito en 4 piezas -- y gasto ~301K tokens, mas que ningun otro agente; y
    `bank-process-discovery` dejo los claims 623/624 que esta sesion reutilizo. Hay evidencia
    de que ayuda. No hay medida propia fiable de cuanto. Las dos cosas a la vez.

  saber_cuando_usar_cada_cosa: >
    El criterio de los tres roles (leer=SKILL, decidir=AGENTE, descubrir=MINERO) SI dirigio
    decisiones reales esta sesion, y se puede senalar donde: A69 se dio de alta como MINERO y
    no como agente porque enumerar es determinista; la mitad del harness se declaro
    UNOBSERVABLE en vez de omitirse; el HELPER se separo del SKILL porque el dano de
    ignorarlos es distinto (uno no aplica conocimiento, el otro produce hallazgos FALSOS); y
    en H135 se eligio DECLARAR en vez de renumerar porque la evidencia -- H113 y H112 citados
    en 5 ficheros cada uno -- decia el coste. El eje que mas trabajo hizo fue el de
    PROCEDENCIA (seccion 1a): es el que separa 'no lo veo' de 'no existe'.

  ⛔_la_medida_incomoda: >
    `meta_capability.py` sigue en 65,3% y DURABILITY en 0,10 -- NO SE MOVIO. El arranque pide
    explicitamente "elige UNA sub-palanca debil y muevela esta sesion", y la sesion entera fue
    a instrumentos. La palanca de durabilidad es la copia de seguridad, el disco `D:` sigue
    desconectado, y 23 GB (Golden DB + memoria) existen solo en un disco. Trabajar sobre los
    instrumentos es util Y no es lo mismo que mover la capacidad mas debil. Si esto se repite
    tres sesiones seguidas, el problema no es el disco: es que el bucle premia lo que sabe
    medir y la durabilidad no se mide con un grafo.

  lo_que_cambio_EN_LA_CAJA_por_esta_evaluacion:
    - >
      dos reglas nuevas: `feedback_an_instrument_is_not_done_until_it_fails_on_purpose`
      (CRITICAL) y `feedback_a_citation_an_import_and_a_mention_are_not_use` (HIGH)
    - >
      `salud.colaboracion_entre_agentes` separa ENTREGA de MENCION y anade
      `agentes_AISLADOS_en_los_dos_sentidos`: el agregado viejo juntaba dos cosas
    - >
      `salud.helpers`: tipo de nodo nuevo, 10 helpers, USA 87, DEBERIA_USAR 5, y los 9 sin
      ficha nombrados en vez de escondidos
    - >
      el trazador de agentes distingue "la clave no viene" de "la clave viene vacia"

# -------------------------------------------------------------------------------------
# 8. LO QUE ESTE MODELO TODAVIA NO SABE
# -------------------------------------------------------------------------------------
known_unknowns:
  - la colaboracion se modela como DELEGA derivado de nombrarse en el prompt. No hay
    evidencia de que la delegacion OCURRA en ejecucion, solo de que este declarada
  - >
    `generaliza` es un campo nuevo: hoy lo declara 1 minero de 64. Eso mide adopcion del
    campo, NO genericidad
  - el termometro mide conectividad declarada, no USO real. Un LEE es una cita, no una lectura
  - 9 de 15 trabajos siguen con alguna pieza sin aterrizar, y 3 dominios sin doc de proceso
